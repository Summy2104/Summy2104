  <text x="600" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-weight="700" font-size="40" fill="url(#acdh)">AI Agent &amp; RAG Engineer</text>
  <text x="600" y="178" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="1" fill="#8DA7C0">Python · LangGraph · MCP · Multimodal RAG · BUPT</text>
  <rect x="586" y="190" width="28" height="3" rx="1.5" fill="#58A6FF"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.6s" repeatCount="indefinite"/></rect>
