  <clipPath id="cplf"><rect width="1200" height="120"/></clipPath>
</defs>
<g clip-path="url(#cplf)">
  <rect width="1200" height="120" fill="url(#bglf)"/>
  <rect width="1200" height="120" fill="url(#dtlf)"/>
  <g filter="url(#bllf)" opacity=".28">
    <circle cx="180" cy="30" r="120" fill="#2F81F7"><animate attributeName="cx" values="180;300;180" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="30;80;30" dur="17s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="40" r="135" fill="#22B8CF"><animate attributeName="cx" values="980;850;980" dur="21s" repeatCount="indefinite"/><animate attributeName="cy" values="40;10;40" dur="21s" repeatCount="indefinite"/></circle>
