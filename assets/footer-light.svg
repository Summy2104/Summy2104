  </g>
  <path d="M0,42 C100,20 300,64 400,42 C500,20 700,64 800,42 C900,20 1100,64 1200,42 C1300,20 1500,64 1600,42 L1600,120 L0,120 Z" fill="url(#w1lf)"><animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="15s" repeatCount="indefinite"/></path>
  <path d="M0,66 C100,50 300,82 400,66 C500,50 700,82 800,66 C900,50 1100,82 1200,66 C1300,50 1500,82 1600,66 L1600,120 L0,120 Z" fill="url(#w2lf)"><animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="11s" repeatCount="indefinite"/></path>
  <text x="600" y="52" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" letter-spacing="4" fill="#6E8CA8">KEEP BUILDING · KEEP SHIPPING</text>
