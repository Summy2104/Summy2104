<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="AI Agent &amp; Backend">
<defs>
  <linearGradient id="bglf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBFF"/><stop offset="1" stop-color="#E4F0FF"/></linearGradient>
  <linearGradient id="aclf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F6FEB"/><stop offset=".5" stop-color="#0EA5B7"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <linearGradient id="w1lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F81F7" stop-opacity=".16"/><stop offset="1" stop-color="#2F81F7" stop-opacity="0"/></linearGradient>
  <linearGradient id="w2lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22B8CF" stop-opacity=".14"/><stop offset="1" stop-color="#22B8CF" stop-opacity="0"/></linearGradient>
  <pattern id="dtlf" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#2F81F7" opacity=".13"/></pattern>
