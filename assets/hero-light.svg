<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="AI Agent &amp; Backend">
<defs>
  <linearGradient id="bglh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBFF"/><stop offset="1" stop-color="#E4F0FF"/></linearGradient>
  <linearGradient id="aclh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F6FEB"/><stop offset=".5" stop-color="#0EA5B7"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <linearGradient id="w1lh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F81F7" stop-opacity=".16"/><stop offset="1" stop-color="#2F81F7" stop-opacity="0"/></linearGradient>
  <linearGradient id="w2lh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22B8CF" stop-opacity=".14"/><stop offset="1" stop-color="#22B8CF" stop-opacity="0"/></linearGradient>
  <pattern id="dtlh" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#2F81F7" opacity=".13"/></pattern>
  <filter id="bllh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
  <clipPath id="cplh"><rect width="1200" height="260"/></clipPath>
</defs>
<g clip-path="url(#cplh)">
  <rect width="1200" height="260" fill="url(#bglh)"/>
  <rect width="1200" height="260" fill="url(#dtlh)"/>
  <g filter="url(#bllh)" opacity=".28">
    <circle cx="180" cy="30" r="120" fill="#2F81F7"><animate attributeName="cx" values="180;300;180" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="30;80;30" dur="17s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="40" r="135" fill="#22B8CF"><animate attributeName="cx" values="980;850;980" dur="21s" repeatCount="indefinite"/><animate attributeName="cy" values="40;10;40" dur="21s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="230" r="110" fill="#8B5CF6" opacity=".55"><animate attributeName="cx" values="600;700;600" dur="19s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M0,192 C100,170 300,214 400,192 C500,170 700,214 800,192 C900,170 1100,214 1200,192 C1300,170 1500,214 1600,192 L1600,260 L0,260 Z" fill="url(#w1lh)"><animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="15s" repeatCount="indefinite"/></path>
  <path d="M0,216 C100,200 300,232 400,216 C500,200 700,232 800,216 C900,200 1100,232 1200,216 C1300,200 1500,232 1600,216 L1600,260 L0,260 Z" fill="url(#w2lh)"><animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="11s" repeatCount="indefinite"/></path>
  <text x="600" y="86" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" letter-spacing="5" fill="#5B7A99">// WELCOME TO MY CORNER OF GITHUB</text>
  <text x="600" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-weight="700" font-size="40" fill="url(#aclh)">AI Agent &amp; Backend</text>
  <text x="600" y="178" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="1" fill="#52708C">Multi-Agent Orchestration · Agent Tooling · Python Backend</text>
  <rect x="586" y="190" width="28" height="3" rx="1.5" fill="#1F6FEB"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.6s" repeatCount="indefinite"/></rect>
</g>
